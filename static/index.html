<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crissybot</title>
  <style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0d0d12;
    --surface: #13131a;
    --surface2: #1a1a24;
    --border: #2a2a3a;
    --accent: #c084fc;
    --accent2: #e879f9;
    --accent-glow: rgba(192, 132, 252, 0.15);
    --text: #f0f0f5;
    --text-secondary: #888899;
    --user-bubble: #1e1b2e;
    --user-border: #3b2f5e;
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }

  /* ── LOGIN SCREEN ── */
  #login-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    gap: 14px;
    width: 100%;
    max-width: 380px;
    padding: 0 24px;
  }

  .logo {
    font-size: 32px;
    margin-bottom: 4px;
  }

  #login-screen h1 {
    font-size: 26px;
    font-weight: 600;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  #login-screen .tagline {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }

  #welcome-back {
    font-size: 15px;
    color: var(--accent);
    display: none;
    font-weight: 500;
  }

  #login-subtitle {
    font-size: 13px;
    color: var(--text-secondary);
  }

  #username-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 16px;
    color: var(--text);
    font-size: 15px;
    outline: none;
    font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  #username-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  #login-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.2s, transform 0.1s;
  }

  #login-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  #login-btn:active { transform: translateY(0); }
  #login-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .error { color: #f87171; font-size: 13px; }

  /* ── CHAT SCREEN ── */
  #chat-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
    height: 100vh;
    animation: fadeIn 0.4s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  header {
    width: 100%;
    max-width: 720px;
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

  .header-name {
    font-size: 15px;
    font-weight: 600;
  }

  .header-status {
    font-size: 11px;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  #logout-btn {
    font-size: 12px;
    color: var(--text-secondary);
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 12px;
    cursor: pointer;
    font-family: inherit;
    transition: color 0.2s, border-color 0.2s;
  }

  #logout-btn:hover { color: var(--text); border-color: #444455; }

  #chat-box {
    flex: 1;
    width: 100%;
    max-width: 720px;
    overflow-y: auto;
    padding: 24px 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .message-row { display: flex; flex-direction: column; }

  .crystal-name {
    font-size: 11px;
    font-weight: 500;
    color: var(--accent);
    margin-bottom: 5px;
    padding-left: 2px;
    letter-spacing: .03em;
    text-transform: uppercase;
  }

  .message {
    padding: 12px 16px;
    border-radius: 14px;
    max-width: 78%;
    line-height: 1.65;
    font-size: 14.5px;
    white-space: pre-wrap;
  }

  .user {
    background: var(--user-bubble);
    border: 1px solid var(--user-border);
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }

  .crystal {
    background: var(--surface2);
    border: 1px solid var(--border);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }

  #input-area {
    width: 100%;
    max-width: 720px;
    padding: 16px 24px 20px;
    display: flex;
    gap: 10px;
    border-top: 1px solid var(--border);
  }

  #user-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    color: var(--text);
    font-size: 14.5px;
    outline: none;
    resize: none;
    height: 48px;
    font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  #user-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  #send-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 0 20px;
    font-size: 15px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 500;
    transition: opacity 0.2s, transform 0.1s;
  }

  #send-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  #send-btn:active { transform: translateY(0); }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
</style>
</head>
<body>

  <!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="logo">💎</div>
  <h1>Crissy</h1>
  <p class="tagline">the one and only</p>
  <p id="welcome-back"></p>
  <p id="login-subtitle">Enter your username to continue</p>
  <input type="text" id="username-input" placeholder="Username" />
  <button id="login-btn">Continue</button>
  <span class="error" id="login-error"></span>
</div>

<!-- CHAT SCREEN -->
<div id="chat-screen">
  <header>
    <div class="header-left">
      <div class="avatar">💎</div>
      <div>
        <div class="header-name">Crissy</div>
        <div class="header-status">
          <span class="status-dot"></span> online
        </div>
      </div>
    </div>
    <button id="logout-btn">Leave</button>
  </header>
  <div id="chat-box"></div>
  <div id="input-area">
    <textarea id="user-input" placeholder="Message Crystal..." rows="1"></textarea>
    <button id="send-btn">Send</button>
  </div>
</div>

  <script>
    // Elements
    const loginScreen = document.getElementById('login-screen');
    const chatScreen = document.getElementById('chat-screen');
    const usernameInput = document.getElementById('username-input');
    const loginBtn = document.getElementById('login-btn');
    const loginError = document.getElementById('login-error');
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const logoutBtn = document.getElementById('logout-btn');

    let currentUsername = '';
    let history = [];

    // ── LOGIN ──
    async function login() {
      const username = usernameInput.value.trim();
      if (!username) {
        loginError.textContent = 'Please enter a username.';
        return;
      }

      loginBtn.disabled = true;
      loginError.textContent = '';

      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username })
        });


        const data = await response.json();
        localStorage.setItem('crissy_user', username)
        currentUsername = username;
        history = data.history;

        // show chat screen
        loginScreen.style.display = 'none';
        chatScreen.style.display = 'flex';

        // load existing messages
        if (history.length > 0) {
          history.forEach(msg => {
            addMessage(msg.role === 'assistant' ? 'crystal' : 'user', msg.content);
          });
        }

        userInput.focus();

      } catch (err) {
        loginError.textContent = 'Something went wrong. Try again.';
      }

      loginBtn.disabled = false;
    }

    // ── ADD MESSAGE TO UI ──
    function addMessage(role, text) {
      const wrapper = document.createElement('div');
      wrapper.className = 'message-row';

      if (role === 'crystal') {
        const name = document.createElement('div');
        name.className = 'crystal-name';
        name.textContent = 'Crystal';
        wrapper.appendChild(name);
      }

      const bubble = document.createElement('div');
      bubble.className = `message ${role}`;
      bubble.textContent = text;
      wrapper.appendChild(bubble);

      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
      return bubble;
    }

    // ── SEND MESSAGE ──
    async function sendMessage() {
      const message = userInput.value.trim();
      if (!message) return;

      addMessage('user', message);
      userInput.value = '';
      sendBtn.disabled = true;

      history.push({ role: 'user', content: message });

      const crystalBubble = addMessage('crystal', '');
      let fullResponse = '';

      try {
        const response = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: currentUsername, message })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value);
          fullResponse += chunk;
          crystalBubble.textContent = fullResponse;
          chatBox.scrollTop = chatBox.scrollHeight;
        }

        history.push({ role: 'assistant', content: fullResponse });

      } catch (err) {
        crystalBubble.textContent = 'Something went wrong. Try again.';
      }

      sendBtn.disabled = false;
      userInput.focus();
    }

    // ── LOGOUT ──
    function logout() {
      currentUsername = '';
      history = [];
      chatBox.innerHTML = '';
      chatScreen.style.display = 'none';
      loginScreen.style.display = 'flex';
      usernameInput.value = '';
    }

    // ── EVENT LISTENERS ──
    loginBtn.addEventListener('click', login);
    logoutBtn.addEventListener('click', logout);
    sendBtn.addEventListener('click', sendMessage);

    usernameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') login();
    });

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    const savedUser = localStorage.getItem('crissy_user')
    if (savedUser) {
      const welcomeMsg = document.getElementById('welcome-back');
      welcomeMsg.textContent = `Welcome back, ${savedUser}! I missed you...`;
      welcomeMsg.style.display = 'block';
      usernameInput.value = savedUser;
      document.getElementById('username-input').style.display = 'none';
      document.getElementById('login-subtitle').style.display = 'none';
      document.getElementById('login-btn').style.display = 'none';
      setTimeout(() => login(), 3000);
    }
  </script>

</body>
</html>
