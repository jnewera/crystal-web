<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crystal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 700px;
      padding: 20px;
      font-size: 20px;
      font-weight: 600;
      border-bottom: 1px solid #222;
    }

    #chat-box {
      flex: 1;
      width: 100%;
      max-width: 700px;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      padding: 12px 16px;
      border-radius: 12px;
      max-width: 80%;
      line-height: 1.6;
      font-size: 15px;
      white-space: pre-wrap;
    }

    .user {
      background: #1a1a2e;
      align-self: flex-end;
      border: 1px solid #2a2a4a;
    }

    .crystal {
      background: #1a1a1a;
      align-self: flex-start;
      border: 1px solid #2a2a2a;
    }

    .crystal-name {
      font-size: 12px;
      color: #888;
      margin-bottom: 4px;
      padding-left: 4px;
    }

    #input-area {
      width: 100%;
      max-width: 700px;
      padding: 16px 20px;
      display: flex;
      gap: 10px;
      border-top: 1px solid #222;
    }

    #user-input {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px 16px;
      color: #f0f0f0;
      font-size: 15px;
      outline: none;
      resize: none;
      height: 48px;
    }

    #user-input:focus { border-color: #555; }

    #send-btn {
      background: #2a2a5a;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 20px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #send-btn:hover { background: #3a3a7a; }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>💎 Crystal</header>

  <div id="chat-box"></div>

  <div id="input-area">
    <textarea id="user-input" placeholder="Message Crystal..." rows="1"></textarea>
    <button id="send-btn">Send</button>
  </div>

  <script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    // conversation history — same concept as chatbot.py
    let history = [];

    function addMessage(role, text) {
      const wrapper = document.createElement('div');

      if (role === 'crystal') {
        const name = document.createElement('div');
        name.className = 'crystal-name';
        name.textContent = 'Crystal';
        wrapper.appendChild(name);
      }

      const bubble = document.createElement('div');
      bubble.className = `message ${role}`;
      bubble.textContent = text;
      wrapper.appendChild(bubble);

      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
      return bubble;
    }

    async function sendMessage() {
      const message = userInput.value.trim();
      if (!message) return;

      // show user message
      addMessage('user', message);
      userInput.value = '';
      sendBtn.disabled = true;

      // add to history
      history.push({ role: 'user', content: message });

      // create Crystal's bubble to stream into
      const crystalBubble = addMessage('crystal', '');
      let fullResponse = '';

      try {
        const response = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, history: history.slice(0, -1) })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        // read the stream chunk by chunk
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value);
          fullResponse += chunk;
          crystalBubble.textContent = fullResponse;
          chatBox.scrollTop = chatBox.scrollHeight;
        }

        // save Crystal's response to history
        history.push({ role: 'assistant', content: fullResponse });

      } catch (err) {
        crystalBubble.textContent = 'Something went wrong. Try again.';
      }

      sendBtn.disabled = false;
      userInput.focus();
    }

    // send on button click
    sendBtn.addEventListener('click', sendMessage);

    // send on Enter key (Shift+Enter for new line)
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>

</body>
</html>
