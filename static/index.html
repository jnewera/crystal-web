<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crissybot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* LOGIN SCREEN */
    #login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 16px;
      width: 100%;
      max-width: 400px;
    }

    #login-screen h1 {
      font-size: 28px;
      font-weight: 600;
    }

    #login-screen p {
      font-size: 14px;
      color: #888;
    }

    #username-input {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px 16px;
      color: #f0f0f0;
      font-size: 15px;
      outline: none;
    }

    #username-input:focus { border-color: #555; }

    #login-btn {
      width: 100%;
      background: #2a2a5a;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #login-btn:hover { background: #3a3a7a; }

    .error { color: #ff6b6b; font-size: 13px; }

    /* CHAT SCREEN */
    #chat-screen { display: none; flex-direction: column; align-items: center; width: 100%; height: 100vh; }

    header {
      width: 100%;
      max-width: 700px;
      padding: 16px 20px;
      font-size: 18px;
      font-weight: 600;
      border-bottom: 1px solid #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #logout-btn {
      font-size: 12px;
      color: #888;
      background: none;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
    }

    #logout-btn:hover { color: #fff; border-color: #555; }

    #chat-box {
      flex: 1;
      width: 100%;
      max-width: 700px;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      padding: 12px 16px;
      border-radius: 12px;
      max-width: 80%;
      line-height: 1.6;
      font-size: 15px;
      white-space: pre-wrap;
    }

    .user {
      background: #1a1a2e;
      align-self: flex-end;
      border: 1px solid #2a2a4a;
    }

    .crystal {
      background: #1a1a1a;
      align-self: flex-start;
      border: 1px solid #2a2a2a;
    }

    .crystal-name {
      font-size: 12px;
      color: #888;
      margin-bottom: 4px;
      padding-left: 4px;
    }

    #input-area {
      width: 100%;
      max-width: 700px;
      padding: 16px 20px;
      display: flex;
      gap: 10px;
      border-top: 1px solid #222;
    }

    #user-input {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px 16px;
      color: #f0f0f0;
      font-size: 15px;
      outline: none;
      resize: none;
      height: 48px;
    }

    #user-input:focus { border-color: #555; }

    #send-btn {
      background: #2a2a5a;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 20px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #send-btn:hover { background: #3a3a7a; }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login-screen">
    <h1>💎 Crystal</h1>
    <p>Enter your username to continue</p>
    <input type="text" id="username-input" placeholder="Username" />
    <button id="login-btn">Enter</button>
    <span class="error" id="login-error"></span>
  </div>

  <!-- CHAT SCREEN -->
  <div id="chat-screen">
    <header>
      <span>💎 Crystal</span>
      <button id="logout-btn">Leave</button>
    </header>
    <div id="chat-box"></div>
    <div id="input-area">
      <textarea id="user-input" placeholder="Message Crissy..." rows="1"></textarea>
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script>
    // Elements
    const loginScreen = document.getElementById('login-screen');
    const chatScreen = document.getElementById('chat-screen');
    const usernameInput = document.getElementById('username-input');
    const loginBtn = document.getElementById('login-btn');
    const loginError = document.getElementById('login-error');
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const logoutBtn = document.getElementById('logout-btn');

    let currentUsername = '';
    let history = [];

    // ── LOGIN ──
    async function login() {
      const username = usernameInput.value.trim();
      if (!username) {
        loginError.textContent = 'Please enter a username.';
        return;
      }

      loginBtn.disabled = true;
      loginError.textContent = '';

      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username })
        });

        const data = await response.json();
        currentUsername = username;
        history = data.history;

        // show chat screen
        loginScreen.style.display = 'none';
        chatScreen.style.display = 'flex';

        // load existing messages
        if (history.length > 0) {
          history.forEach(msg => {
            addMessage(msg.role === 'assistant' ? 'crystal' : 'user', msg.content);
          });
        }

        userInput.focus();

      } catch (err) {
        loginError.textContent = 'Something went wrong. Try again.';
      }

      loginBtn.disabled = false;
    }

    // ── ADD MESSAGE TO UI ──
    function addMessage(role, text) {
      const wrapper = document.createElement('div');

      if (role === 'crystal') {
        const name = document.createElement('div');
        name.className = 'crystal-name';
        name.textContent = 'Crystal';
        wrapper.appendChild(name);
      }

      const bubble = document.createElement('div');
      bubble.className = `message ${role}`;
      bubble.textContent = text;
      wrapper.appendChild(bubble);

      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
      return bubble;
    }

    // ── SEND MESSAGE ──
    async function sendMessage() {
      const message = userInput.value.trim();
      if (!message) return;

      addMessage('user', message);
      userInput.value = '';
      sendBtn.disabled = true;

      history.push({ role: 'user', content: message });

      const crystalBubble = addMessage('crystal', '');
      let fullResponse = '';

      try {
        const response = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: currentUsername, message })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value);
          fullResponse += chunk;
          crystalBubble.textContent = fullResponse;
          chatBox.scrollTop = chatBox.scrollHeight;
        }

        history.push({ role: 'assistant', content: fullResponse });

      } catch (err) {
        crystalBubble.textContent = 'Something went wrong. Try again.';
      }

      sendBtn.disabled = false;
      userInput.focus();
    }

    // ── LOGOUT ──
    function logout() {
      currentUsername = '';
      history = [];
      chatBox.innerHTML = '';
      chatScreen.style.display = 'none';
      loginScreen.style.display = 'flex';
      usernameInput.value = '';
    }

    // ── EVENT LISTENERS ──
    loginBtn.addEventListener('click', login);
    logoutBtn.addEventListener('click', logout);
    sendBtn.addEventListener('click', sendMessage);

    usernameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') login();
    });

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>

</body>
</html>
